name: heavy
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run test:heavy
