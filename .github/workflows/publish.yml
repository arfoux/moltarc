name: publish
on:
  push:
    tags:
      - "v*"
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p require('./package.json').version)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Typecheck (same gate as CI)
        run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - run: bash scripts/test-floor.sh
      - run: bun run check:surface
      - run: bun run test:extended
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm config delete '//registry.npmjs.org/:_authToken'
        continue-on-error: true
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
  publish-gpr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p require('./package.json').version)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Typecheck (same gate as CI)
        run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - run: bash scripts/test-floor.sh
      - run: bun run check:surface
      - run: bun run test:extended
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@arfoux'
      - run: npm install -g npm@latest
      - name: Publish to GitHub Packages as scoped package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json /tmp/package.json.bak
          npm pkg set name=@arfoux/moltarc
          npm publish --registry=https://npm.pkg.github.com --access public
          cp /tmp/package.json.bak package.json
  release:
    needs: [publish, publish-gpr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES=$(awk -v tag="$TAG" -v ver="$VER" '
            /^## / {
              if (found) exit
              if ($2 == tag || $2 == ver) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::no CHANGELOG.md section for $TAG (or $VER) — refusing to publish release notes from an unrelated section"
            exit 1
          fi
          printf '%s\n' "$NOTES" | gh release create "$TAG" --title "$TAG" --notes-file -
