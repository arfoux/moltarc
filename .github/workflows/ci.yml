name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - run: bun run test:stable
      - run: bun test ext/
